<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0e">
  <meta name="description" content="Apex Private Banking - Secure Fedwire Transfer Portal">
  <title>Transfers - Apex Private Banking</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/transfers.css">
</head>
<body>

  <!-- Desktop View Indicator -->
  <div class="desktop-preview-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <span>Mobile Web View</span>
  </div>

  <div class="app-viewport">
    <main class="banking-container">
      
      <div class="transfer-page-container">
        
        <!-- Top Status / Sponsorship Bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-top:4px;">
          <h1 style="font-size:24px; font-weight:800; color:#fff; letter-spacing:-0.5px;">Transfers</h1>
          <div class="spotify-sponsor-badge" aria-label="Spotify Partnership">
            <svg viewBox="0 0 24 24">
              <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            <span>Spotify</span>
          </div>
        </div>

        <!-- Pay From Section -->
        <section class="transfer-section" aria-label="Originating Account">
          <h2 class="transfer-section-title">Pay From</h2>
          <div class="pay-from-card" id="payFromCard" role="button" aria-label="Select Source Account">
            <span class="from-label">From Account</span>
            <div class="from-selected-value" id="fromAccountText">
              <span>Select Account</span>
              <!-- Up/Down Double Chevron SVG -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7 15 12 20 17 15"></polyline>
                <polyline points="7 9 12 4 17 9"></polyline>
              </svg>
            </div>
          </div>
        </section>

        <!-- Pay To Section -->
        <section class="transfer-section" aria-label="Recipient Details">
          <h2 class="transfer-section-title">Pay To</h2>
          <div class="pay-to-grouped-card">
            <div class="pay-to-input-row">
              <input type="text" class="transfer-bare-input" id="recipientNameInput" placeholder="Recipient Name" autocomplete="off">
            </div>
            <div class="pay-to-input-row">
              <input type="text" class="transfer-bare-input" id="bankNameInput" placeholder="Bank Name" autocomplete="off">
            </div>
            <div class="pay-to-input-row">
              <input type="text" class="transfer-bare-input" id="accountNumberInput" placeholder="Account Number" inputmode="numeric" autocomplete="off">
            </div>
            <div class="pay-to-input-row">
              <input type="text" class="transfer-bare-input" id="routingNumberInput" placeholder="Routing Number (ABA)" inputmode="numeric" autocomplete="off">
            </div>
          </div>
        </section>

        <!-- Amount Section -->
        <section class="transfer-section" aria-label="Transfer Amount">
          <h2 class="transfer-section-title">Amount</h2>
          <div class="amount-input-card">
            <input type="text" class="amount-input" id="amountInput" placeholder="$ 0.00" inputmode="decimal">
          </div>
        </section>

        <!-- Memo Section -->
        <section class="transfer-section" aria-label="Transfer Memo">
          <h2 class="transfer-section-title">Memo</h2>
          <div class="memo-input-card">
            <input type="text" class="memo-input" id="memoInput" placeholder="Add a note">
          </div>
        </section>

        <!-- Review Payment Action Button (Exact Match) -->
        <div class="review-payment-btn-wrap">
          <button class="review-payment-btn disabled" id="reviewPaymentBtn" type="button" disabled>
            <!-- Real Vector Lock Icon -->
            <svg viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
            <span>Review Payment</span>
          </button>
        </div>

      </div>

      <!-- Floating Bottom Navigation Bar (Transfers is Active) -->
      <div class="bottom-nav-container">
        <nav class="bottom-nav" aria-label="Main Navigation">
          <button class="nav-item" id="navHomeBtn" data-tab="home">
            <svg viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
          </button>

          <button class="nav-item" id="navAccountsBtn" data-tab="accounts">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
            <span>Accounts</span>
          </button>

          <button class="nav-item active" data-tab="transfers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="8" x2="20" y2="8"></line>
              <polyline points="15 3 20 8 15 13"></polyline>
              <line x1="20" y1="16" x2="4" y2="16"></line>
              <polyline points="9 11 4 16 9 21"></polyline>
            </svg>
            <span>Transfers</span>
          </button>

          <button class="nav-item" id="navPayBtn" data-tab="pay">
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span>Pay</span>
          </button>
        </nav>
      </div>

    </main>
  </div>

  <!-- Interactive Action Sheet / Modal System -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="sheetTitle">Action</h3>
        <button class="sheet-close-btn" id="sheetCloseBtn" aria-label="Close dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Micro Toast Notification Component -->
  <div class="banking-toast" id="bankingToast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <span id="toastMessage">Success</span>
  </div>

  <script src="js/transfers.js"></script>
</body>
</html>
